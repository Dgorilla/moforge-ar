<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DeepStem HUB Kit Case in AR — MO FORGE</title>
  <meta name="description" content="Scan-to-AR preview of DeepStem HUB Kit Case — see it at true scale in your own space." />
  <!-- Minimal chrome, deliberately: this page is reached by scanning a QR code on cellular
       data, often standing at a desk about to decide "does this fit here." Every non-essential
       byte here is a real cost to that moment. -->
  <link rel="stylesheet" href="../../ar-viewer.css" />
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1c1a17; background: #fff; }
    .qr-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid #eee;
    }
    .qr-brand { font-weight: 700; font-size: 14px; letter-spacing: 0.02em; }
    .qr-share {
      border: 1px solid #ddd3c2; background: #fff; border-radius: 999px;
      padding: 6px 12px; font-size: 13px; cursor: pointer;
    }
    .qr-page { max-width: 560px; margin: 0 auto; padding: 16px; }
    .qr-name { font-size: 17px; font-weight: 600; margin: 12px 0 2px; }
    .qr-shop-link { display: inline-block; margin-top: 14px; font-size: 14px; color: #7c5920; }
  </style>
</head>
<body>
  <header class="qr-header">
    <span class="qr-brand">MO FORGE</span>
    <button class="qr-share" id="share-btn" type="button" aria-label="Share this AR preview">Share</button>
  </header>

  <main class="qr-page">
    <div
      class="arv-wrap"
      data-arv
      data-name="DeepStem HUB Kit Case"
      data-glb="../../models/deepstem-case/model.glb?v=2415f24826"
      data-usdz=""
      data-poster=""
      data-width-mm="370"
      data-depth-mm="326"
      data-height-mm="75"
      data-animated="true"
    ></div>
    <p class="qr-name">DeepStem HUB Kit Case</p>
    <a class="qr-shop-link" href="../../">Shop matching products &rarr;</a>
  </main>

  <script src="../../ar-viewer.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => ARViewer.init());

    // Real Web Share API where available (native iOS/Android share sheet); falls back to
    // copying the URL, since a QR-landing page is exactly the kind of link people forward.
    document.getElementById("share-btn").addEventListener("click", async () => {
      const shareData = { title: document.title, url: location.href };
      if (navigator.share) {
        try { await navigator.share(shareData); } catch (e) { /* user cancelled — not an error */ }
      } else {
        try {
          await navigator.clipboard.writeText(location.href);
          alert("Link copied.");
        } catch (e) {
          prompt("Copy this link:", location.href);
        }
      }
    });
  </script>
</body>
</html>
