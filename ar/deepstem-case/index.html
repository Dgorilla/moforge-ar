<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>DeepStem HUB Kit Case · AR — MO FORGE</title>
  <!-- AR-first landing page (QR target). Full-screen product; one tap (or, on Android,
       an automatic attempt) opens the phone's own camera AR viewer at true scale:
       Android -> Google Scene Viewer, iPhone -> Apple Quick Look (needs the .usdz).
       Browsers never allow a page to open the camera without a user tap; the Android
       auto-launch is best-effort and falls back to the button. -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <style>
    :root { --ink: #111; --accent: #00ae42; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #f4f4f2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    model-viewer { width: 100vw; height: 100vh; height: 100dvh; --poster-color: transparent; background: radial-gradient(circle at 50% 40%, #fff 0%, #ecece8 70%); }
    .brand { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 16px; right: 16px; pointer-events: none; z-index: 2; line-height: 1.35; }
    .brand b { display: block; font-size: 15px; letter-spacing: .04em; color: var(--ink); }
    .brand span { display: block; font-size: 13px; color: #555; overflow-wrap: anywhere; }
    .ar-btn { position: fixed; left: 50%; transform: translateX(-50%); width: calc(100vw - 32px); max-width: 520px; bottom: max(22px, env(safe-area-inset-bottom)); z-index: 3;
              border: 0; border-radius: 18px; padding: 20px 16px; font-size: 20px; font-weight: 700; color: #fff; background: var(--accent);
              box-shadow: 0 8px 24px rgba(0,0,0,.25); }
    .hint { position: fixed; left: 0; right: 0; padding: 0 16px; bottom: calc(max(22px, env(safe-area-inset-bottom)) + 76px); text-align: center; font-size: 13px; color: #444; z-index: 2; pointer-events: none; }
    .no-ar .ar-btn { background: #555; }
  </style>
</head>
<body>
  <div class="brand"><b>MO FORGE</b><span>DeepStem HUB Kit Case</span><span>370 × 326 × 75 mm · real size in AR</span></div>

  <model-viewer id="mv"
    src="../../models/deepstem-case/model.glb?v=bd26e8b1e0" ios-src="../../models/deepstem-case/model.usdz?v=394cd3f75c" alt="DeepStem HUB Kit Case 3D model"
    ar ar-modes="scene-viewer quick-look webxr" ar-scale="auto" ar-placement="floor"
    camera-controls touch-action="pan-y" autoplay animation-name="open-tray-close"
    camera-orbit="-30deg 62deg auto" field-of-view="32deg" min-camera-orbit="auto auto 40%"
    interaction-prompt="none" shadow-intensity="1" exposure="1.05" environment-image="neutral">
    <button slot="ar-button" class="ar-btn">📷 View it in your room</button>
  </model-viewer>
  <div class="hint">Opens your camera · place it on a table at real size</div>

  <script>
    (function () {
      var mv = document.getElementById("mv");
      var params = new URLSearchParams(location.search);
      var android = /Android/i.test(navigator.userAgent);
      // Android: best-effort straight into Scene Viewer (Google's camera AR). If the browser
      // blocks the redirect (no user gesture), nothing happens and the big button remains.
      if (android && !params.has("noauto")) {
        try {
          if (!sessionStorage.getItem("ar-auto-deepstem-case")) {
            sessionStorage.setItem("ar-auto-deepstem-case", "1");
            var glb = new URL(mv.getAttribute("src"), location.href).href;
            var back = location.href.split("#")[0] + (location.search ? "&" : "?") + "noauto=1";
            location.href = "intent://arvr.google.com/scene-viewer/1.0?file=" + encodeURIComponent(glb) +
              "&mode=ar_preferred&resizable=true&title=" + encodeURIComponent("DeepStem HUB Kit Case") +
              "#Intent;scheme=https;package=com.google.android.googlequicksearchbox;" +
              "action=android.intent.action.VIEW;S.browser_fallback_url=" + encodeURIComponent(back) + ";end;";
          }
        } catch (e) { /* storage blocked: stay on the button */ }
      }
      mv.addEventListener("load", function () {
        if (!mv.canActivateAR) {
          document.body.classList.add("no-ar");
          mv.querySelector(".ar-btn").textContent = "Drag to rotate · AR needs a phone";
        }
      });
    })();
  </script>
</body>
</html>
